# DSI Innovators Elite - Daily Job Collection Workflow

name: DSI Elite Daily Collection

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  collect-jobs:
    name: Collect Strict ICP Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # --- FIX: Create the output folder ---
      - name: Create output directory
        run: mkdir -p ./output
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run elite scraper
        run: |
          python dsi_scraper_elite.py --output-dir ./output --verbose
        env:
          PYTHONUNBUFFERED: 1
      
      - name: List output files
        run: |
          ls -la ./output/
      
      - name: Upload final CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsi-elite-jobs
          path: ./output/FINAL_USE_THIS_ONLY_*.csv
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      
      - name: Summary
        run: |
          echo "## 📊 Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Output**: \`FINAL_USE_THIS_ONLY_*.csv\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: Available in Actions tab for 7 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important" >> $GITHUB_STEP_SUMMARY
          echo "- Only rows with quality_tier = \`A_STRICT_DSI_ICP\` are included" >> $GITHUB_STEP_SUMMARY
          echo "- All jobs have verified headcount 10-200, worldwide remote proof, no restrictions" >> $GITHUB_STEP_SUMMARY
          echo "- If CSV is empty, add more verified companies to sources.yml" >> $GITHUB_STEP_SUMMARY
